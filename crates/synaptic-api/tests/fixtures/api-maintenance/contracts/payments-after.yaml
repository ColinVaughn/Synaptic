openapi: 3.1.0
info:
  title: Synthetic Payments API
  version: 2026-07-31
paths:
  /v2/customers:
    post:
      operationId: createCustomer
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email: {type: string}
                display_name: {type: string}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
webhooks:
  customer.updated:
    post:
      operationId: customerUpdated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id: {type: string}
      responses:
        "200": {description: accepted}
