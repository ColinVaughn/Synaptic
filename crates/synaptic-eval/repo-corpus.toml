# Pinned external repositories for the benchmark suites.
#
#   suites = ["scale"]    timed by `synaptic eval scale`   (cold/warm/incremental)
#   suites = ["quality"]  scored by `synaptic eval quality` (anchors/parse/oracle)
#
# An entry with no `suites` key is quality-only. The scale subset is deliberately
# small and size-tiered so its published timings stay comparable across releases;
# the quality suite is language-complete instead, because a language with no real
# repository behind it is a language whose extractor has never been checked
# against code anyone wrote. `.F90` routing to no extractor at all, and Pascal
# losing 58% of its anchors, both survived exactly that gap.
#
# `languages` is enforced: `every_extractor_is_benchmarked` fails when a shipped
# extractor appears in no entry here, so a new language cannot ship unmeasured.
#
# Network + git required; opt-in (never run in CI).
#
# SHAs are pinned deliberately -- a moved SHA changes the numbers. Refresh with
# `synaptic eval quality --pin`, which resolves every URL's current HEAD.

# ---------------------------------------------------------------------------
# Throughput subset (also scored for quality). Pinned 2026-08-12.
# ---------------------------------------------------------------------------

