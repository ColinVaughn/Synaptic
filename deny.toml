# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 (Marvin Attack in the `rsa` crate) has no patched release.
    # `rsa` is pulled in only by sqlx's MySQL driver (the optional, off-by-default
    # `live-explain` feature), and only for client-side password encryption with
    # the server's PUBLIC key during caching_sha2_password auth -- the vulnerable
    # RSA private-key path the timing attack targets is never exercised here.
    # Revisit when a constant-time `rsa` release ships (RustCrypto/RSA#390).
    #
    # cargo-deny ignores have no expiry, so the reviewable record of this
    # decision lives in .synaptic/vuln-policy.toml as finding
    # vuln_finding_2852589210b6008289db2c9e, accepted until 2027-02-01. That
    # exception does expire: after the date `synaptic vuln scan` reports the
    # finding again, which is what forces this entry to be revisited rather
    # than inherited forever. Remove both together, or renew both together.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
confidence-threshold = 0.8
# Licenses common in the Rust ecosystem, plus this project's AGPL license.
# Tuned to the actual dependency set.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
    # The crates.io archive predates the regenerated parser required for
    # anonymous CodeQL modules. Keep this exception exact and revision-pinned.
    "https://github.com/tree-sitter/tree-sitter-ql.git",
]
