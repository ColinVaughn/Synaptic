name: release

# Build prebuilt `synaptic` and optional `synaptic-ui` binaries for Linux/macOS/Windows and attach them to
# the GitHub Release when a `v*` tag is pushed, and sync the `wiki/` directory to
# the GitHub wiki. Run manually via workflow_dispatch to smoke-test the build
# matrix (and re-sync the wiki) without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - name: Install pinned license-notice generator
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Generate locked third-party license notices
        shell: bash
        run: cargo about generate --target "${{ matrix.target }}" about.hbs --output-file THIRD_PARTY_LICENSES.html
      - run: cargo build --release --locked -p synaptic -p synaptic-ui --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dist="synaptic-${{ matrix.target }}"
          mkdir "$dist"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/synaptic.exe" "$dist/"
            cp "target/${{ matrix.target }}/release/syn.exe" "$dist/"
            cp "target/${{ matrix.target }}/release/synaptic-ui.exe" "$dist/"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp "target/${{ matrix.target }}/release/synaptic" "$dist/"
            cp "target/${{ matrix.target }}/release/syn" "$dist/"
            app="$dist/Synaptic.app"
            mkdir -p "$app/Contents/MacOS"
            cp "target/${{ matrix.target }}/release/synaptic-ui" "$app/Contents/MacOS/"
            ln "$dist/synaptic" "$app/Contents/MacOS/synaptic"
            ln "$dist/syn" "$app/Contents/MacOS/syn"
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "synaptic-ui") | .version')"
            cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleDisplayName</key><string>Synaptic</string><key>CFBundleExecutable</key><string>synaptic-ui</string><key>CFBundleIdentifier</key><string>com.synapticgraph.desktop</string><key>CFBundleName</key><string>Synaptic</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>${version}</string></dict></plist>
          EOF
          else
            cp "target/${{ matrix.target }}/release/synaptic" "$dist/"
            cp "target/${{ matrix.target }}/release/syn" "$dist/"
            cp "target/${{ matrix.target }}/release/synaptic-ui" "$dist/"
          fi
          cp README.md LICENSE NOTICE CHANGELOG.md THIRD_PARTY_LICENSES.html "$dist/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${dist}.zip" "$dist"
            certutil -hashfile "${dist}.zip" SHA256 | sed -n '2p' | tr -d ' \r' > "${dist}.zip.sha256"
          else
            tar czf "${dist}.tar.gz" "$dist"
            shasum -a 256 "${dist}.tar.gz" | awk '{print $1}' > "${dist}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: synaptic-${{ matrix.target }}
          path: |
            synaptic-${{ matrix.target }}.tar.gz
            synaptic-${{ matrix.target }}.tar.gz.sha256
            synaptic-${{ matrix.target }}.zip
            synaptic-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attest release archives and checksums
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  publish-wiki:
    # Sync wiki/ (as committed on the released ref) to the GitHub wiki repo, but
    # only commit when it actually differs from what is already published.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Sync wiki/ to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d wiki ]; then
            echo "no wiki/ directory; nothing to publish"
            exit 0
          fi
          tmp="$(mktemp -d)"
          # Build the authenticated clone URL without a literal user@host token.
          auth="https://x-access-token:${GH_TOKEN}"
          repo="${auth}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$repo" "$tmp"; then
            echo "::error::wiki repo not found. Create the first page in the GitHub UI once, then re-run."
            exit 1
          fi
          # Mirror wiki/ into the wiki repo: delete pages removed from source,
          # but never touch the wiki repo's own .git.
          rsync -a --delete --exclude '.git' wiki/ "$tmp/"
          cd "$tmp"
          bot="github-actions[bot]"
          git config user.name "$bot"
          git config user.email "41898282+${bot}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date; nothing to publish."
          else
            git commit -m "docs(wiki): sync from ${GITHUB_REF_NAME} (${GITHUB_SHA})"
            git push origin HEAD
          fi
